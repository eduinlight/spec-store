[package]
name = "spec-store-core"
description = "Business rules and persistence of spec-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "spec_store"
path = "src/lib.rs"

[[bin]]
name = "spec-store"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
diesel = { version = "2.3", default-features = false, features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
rand = "0.10"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
similar = { version = "3", default-features = false, features = ["text"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
