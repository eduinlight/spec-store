[package]
name = "spec-store-core"
description = "Business rules and persistence of spec-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aws-lc-rs = "1.18"
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
lettre = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { version = "2.3", features = ["postgres"] }
sha2 = "0.11"
rand = "0.10"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
similar = { version = "3", default-features = false, features = ["text"] }

[dev-dependencies]
spec-store-testkit = { workspace = true }
tokio = { workspace = true }
