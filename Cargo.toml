[workspace]
resolver = "3"
members = ["packages/core", "packages/testkit"]
default-members = ["packages/core", "packages/testkit"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/eduinlight/spec-store"

[workspace.dependencies]
spec-store-core = { path = "packages/core" }
spec-store-testkit = { path = "packages/testkit" }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "chrono"] }
