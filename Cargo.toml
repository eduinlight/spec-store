[workspace]
resolver = "3"
members = ["packages/core", "packages/testkit", "apps/api", "apps/mcp"]
default-members = ["packages/core", "packages/testkit", "apps/api", "apps/mcp"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/eduinlight/spec-store"

[workspace.dependencies]
spec-store-core = { path = "packages/core" }
spec-store-testkit = { path = "packages/testkit" }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "chrono"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
tracing = "0.1"
