[workspace]
resolver = "3"
members = ["packages/core", "packages/testkit", "apps/api", "apps/mcp", "apps/cli"]
default-members = ["packages/core", "packages/testkit", "apps/api", "apps/mcp", "apps/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/eduinlight/sdd-vault"

[workspace.dependencies]
sdd-vault-core = { path = "packages/core" }
sdd-vault-testkit = { path = "packages/testkit" }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "chrono"] }
axum = { version = "0.8", features = ["ws"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls-tls"] }
tracing = "0.1"
