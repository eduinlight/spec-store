map $cookie_spec_store_lang $language_from_cookie {
  default "";
  en en;
  es es;
}

map $http_accept_language $language_from_browser {
  default en;
  "~*^es" es;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = / {
    set $language $language_from_cookie;
    if ($language = "") {
      set $language $language_from_browser;
    }
    if ($language = "es") {
      return 302 /es;
    }
    add_header Cache-Control "no-cache";
    add_header Vary "Cookie, Accept-Language";
    try_files /index.html =404;
  }

  location = /es {
    add_header Cache-Control "no-cache";
    try_files /es/index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
}
