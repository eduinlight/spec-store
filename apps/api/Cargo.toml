[package]
name = "spec-store-api"
description = "spec-store HTTP API: JSON endpoints, browser sign-in and outbound email"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spec-store-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spec-store-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6"
utoipa-axum = "0.3"

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
spec-store-mcp = { path = "../mcp" }
diesel = { workspace = true }
http-body-util = "0.1"
spec-store-testkit = { workspace = true }
tower = { version = "0.5", features = ["util"] }
