name: Build image

on:
  workflow_call:
    inputs:
      deliverable:
        description: One of api, mcp, app, landing, keycloak or backup.
        required: true
        type: string
      tags:
        description: Space-separated image tags to push.
        required: true
        type: string
      app_url:
        description: The app address compiled into the landing page. Required for landing.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/eduinlight/sdd-vault-${{ inputs.deliverable }}
      RUST: ${{ contains(fromJSON('["api","mcp"]'), inputs.deliverable) }}
      NODE: ${{ contains(fromJSON('["app","landing"]'), inputs.deliverable) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        if: env.RUST == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Rust 1.97
        if: env.RUST == 'true'
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo
        if: env.RUST == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: image-${{ inputs.deliverable }}

      - name: Build the binary
        if: env.RUST == 'true'
        run: cargo build --locked --release -p sdd-vault-${{ inputs.deliverable }}

      - name: Install pnpm
        if: env.NODE == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node 24
        if: env.NODE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install packages
        if: env.NODE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the app
        if: inputs.deliverable == 'app'
        run: pnpm --filter app build

      - name: Build the landing page
        if: inputs.deliverable == 'landing'
        env:
          VITE_APP_URL: ${{ inputs.app_url }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_APP_URL" ]; then
            echo "::error::the landing page needs app_url"
            exit 1
          fi
          pnpm --filter landing build
          if ! grep -rqF "$VITE_APP_URL" apps/landing/build/client; then
            echo "::error::the landing build does not link to $VITE_APP_URL"
            exit 1
          fi
          case "$VITE_APP_URL" in
            https://staging-*) ;;
            *)
              if grep -rqF "https://staging-app-sddvault.eduindev.com" apps/landing/build/client; then
                echo "::error::the landing build links to the staging app"
                exit 1
              fi
              ;;
          esac

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          args=()
          for tag in $TAGS; do
            args+=(-t "$IMAGE:$tag")
          done
          docker build -f "deploy/${{ inputs.deliverable }}/Dockerfile" "${args[@]}" .
          for tag in $TAGS; do
            docker push "$IMAGE:$tag"
          done
