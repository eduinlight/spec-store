name: Deploy mcp

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "packages/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/mcp/**"
      - ".github/workflows/deploy-mcp.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      deliverable: mcp
      tags: ${{ github.sha }} latest

  bump-cd:
    needs: image
    uses: ./.github/workflows/cd-bump.yml
    with:
      image: ghcr.io/eduinlight/sdd-vault-mcp
      tag: ${{ github.sha }}
      overlay: staging
    secrets: inherit
